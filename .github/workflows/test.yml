name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call: # Makes this workflow reusable

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    environment: test
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest tests

      - name: Lint with Ruff
        run: uv run ruff check . --output-format=github

      - name: Type check with ty
        run: uv run ty check . --output-format=github

  test-minimum-homeassistant:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Set up Python
        run: uv python install

      - name: Resolve the minimum supported Home Assistant
        run: uv lock --upgrade-package homeassistant --resolution lowest-direct

      - name: Install the project
        run: uv sync --all-extras --dev --locked --resolution lowest-direct

      - name: Verify the Home Assistant version
        run: >-
          uv run --locked --resolution lowest-direct python -c
          "from importlib.metadata import version;
          assert version('homeassistant') == '2026.3.0'"

      - name: Run tests
        run: uv run --locked --resolution lowest-direct pytest tests
